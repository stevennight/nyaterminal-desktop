name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Prepare release metadata
        id: meta
        shell: pwsh
        run: |
          $buildDate = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          "version=$env:GITHUB_REF_NAME" >> $env:GITHUB_OUTPUT
          "build_date=$buildDate" >> $env:GITHUB_OUTPUT

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test desktop frontend
        working-directory: frontend
        run: npm test

      - name: Build desktop frontend
        working-directory: frontend
        run: npm run build

      - name: Test desktop Go packages
        run: go test ./...

      - name: Build Windows desktop client
        shell: pwsh
        run: |
          .\build.ps1 `
            -Version '${{ steps.meta.outputs.version }}' `
            -Commit '${{ github.sha }}' `
            -BuildDate '${{ steps.meta.outputs.build_date }}' `
            -UpdateRepository '${{ github.repository }}'

      - name: Package Windows artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -LiteralPath build\bin\* -DestinationPath "dist\NyaTerminal-${{ steps.meta.outputs.version }}-windows-amd64.zip" -Force

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: NyaTerminal Desktop ${{ steps.meta.outputs.version }}
          generate_release_notes: true
          files: dist/*.zip
