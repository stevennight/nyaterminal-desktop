name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      build_date: ${{ steps.version.outputs.build_date }}

    steps:
      - name: Validate release tag
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'

          if [[ "${GITHUB_REF_NAME}" != "v${version}" || ! "${version}" =~ ${semver} ]]; then
            echo "Release tags must use stable vMAJOR.MINOR.PATCH format; received ${GITHUB_REF_NAME}." >&2
            exit 1
          fi

          IFS='.' read -r major minor patch <<< "${version}"
          if (( major > 255 || minor > 255 || patch > 65535 )); then
            echo "Release tag ${GITHUB_REF_NAME} exceeds Windows installer version limits." >&2
            exit 1
          fi

          echo "value=${version}" >> "${GITHUB_OUTPUT}"
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "${GITHUB_OUTPUT}"

  verify:
    name: Verify release source
    needs: metadata
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: go test ./...
      - run: go vet ./...

  windows:
    name: Build Windows installer
    needs: [metadata, verify]
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Install NSIS
        run: choco install nsis --no-progress --yes
      - name: Build desktop and installer
        shell: pwsh
        run: |
          .\build.ps1 `
            -Installer `
            -Version '${{ needs.metadata.outputs.version }}' `
            -Commit '${{ github.sha }}' `
            -BuildDate '${{ needs.metadata.outputs.build_date }}' `
            -UpdateRepository '${{ github.repository }}'
      - name: Collect release files
        shell: pwsh
        run: |
          $version = '${{ needs.metadata.outputs.version }}'
          $output = 'release-artifacts'
          New-Item -ItemType Directory -Force -Path $output | Out-Null

          $installer = 'build\bin\NyaTerminal-amd64-installer.exe'
          $executable = 'build\bin\NyaTerminal.exe'
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) { throw "NSIS installer was not produced." }
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) { throw "Desktop executable was not produced." }

          Copy-Item -LiteralPath $installer -Destination "$output\NyaTerminal_${version}_x64-setup.exe"
          $portable = "$output\portable"
          New-Item -ItemType Directory -Force -Path $portable | Out-Null
          Copy-Item -LiteralPath $executable -Destination $portable
          Compress-Archive -Path "$portable\*" -DestinationPath "$output\NyaTerminal_${version}_windows_x64.zip" -Force
          Remove-Item -LiteralPath $portable -Recurse -Force
      - uses: actions/upload-artifact@v4
        with:
          name: NyaTerminal-Windows-${{ github.ref_name }}
          path: release-artifacts/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [metadata, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: NyaTerminal-*
          path: downloaded-artifacts
      - name: Assemble checksums
        shell: bash
        run: |
          mkdir release-files
          while IFS= read -r -d '' source; do
            filename="$(basename "${source}")"
            test ! -e "release-files/${filename}" || { echo "Duplicate release asset: ${filename}" >&2; exit 1; }
            cp "${source}" "release-files/${filename}"
          done < <(find downloaded-artifacts -type f \( -name '*.exe' -o -name '*.zip' \) -print0)
          test -n "$(find release-files -maxdepth 1 -type f -print -quit)" || { echo "No release files were downloaded." >&2; exit 1; }
          (
            cd release-files
            sha256sum * > SHA256SUMS
          )
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: NyaTerminal v${{ needs.metadata.outputs.version }}
          generate_release_notes: true
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
